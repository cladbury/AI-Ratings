  refs.next=el('button',{class:'btn',onclick:()=>go(pos+1)},'Next →');
  const nextOpen=el('button',{class:'btn primary',onclick:()=>{const i=findOpen(pos+1); if(i>=0) go(i);}},'Next unscored');
  const sheet=el('aside',{class:'card sheet'},
    el('div',{class:'eyebrow'},'Score this answer'),
    ...axisEls,
    el('div',{class:'flags'},...flagEls),
    el('label',{for:'comment',class:'eyebrow',style:'display:block;margin-top:12px'},'Comment'),
    refs.comment,
    el('div',{class:'nav'},refs.prev,refs.next),
    el('div',{class:'nav',style:'margin-top:8px'},nextOpen),
    el('div',{class:'keys'},el('kbd',{},'1'),'–',el('kbd',{},'4'),' fills the next empty axis · ',el('kbd',{},'Y'),'/',el('kbd',{},'N'),' fills the next flag · ',el('kbd',{},'←'),' ',el('kbd',{},'→'),' move. Auto-advance is off.')
  );
  app.append(el('div',{class:'bench'},resp,sheet));

  app.append(el('details',{class:'card rubric',open:''},
    el('summary',{},'Scoring instructions'),
    el('ul',{},el('li',{},'Rate only based on the question as asked; do not assume extra facts about the patient.'),
      el('li',{},'The audience is a patient. Judge language, scope, and safety guidance for a lay reader.'),
      el('li',{},'Response IDs are random codes. Answers are shown as plain text with identifying product text removed.')),
    el('div',{class:'cols'},AXES.map(a=>el('div',{},el('h4',{},a.name),el('ol',{},a.d.map(x=>el('li',{},x))))),
      el('div',{},el('h4',{},'Binary flags'),el('ol',{style:'list-style:none;padding-left:0'},FLAGS.map(f=>el('li',{},f.name+' (Y/N)')))))
  ));

  refs.map=el('div',{class:'grid'});
  app.append(el('section',{class:'card map'},el('h2',{},'Progress by question',el('span',{class:'legend'},
    el('span',{},el('i',{style:'background:var(--done)'}),'complete'),el('span',{},el('i',{style:'background:var(--partial)'}),'partial'),el('span',{},el('i',{style:'background:var(--bg);border:1px solid var(--line)'}),'not started'))),refs.map));
  buildMap();
  paint();
}
const cur=()=>order[pos];
function findOpen(from){for(let k=0;k<order.length;k++){const i=(from+k)%order.length;if(status(order[i])!=='done')return i}return -1}
function go(i){ if(i<0||i>=order.length) return; pos=i; lsSet('pos:'+reviewer,pos); paint(); window.scrollTo({top:0,behavior:'auto'}); }
let qGroups=[];
function buildMap(){
  refs.map.innerHTML=''; qGroups=[]; refs.cells={};
  let i=0; let n=1;
  while(i<order.length){
    const q=BYID[order[i]].q; const row=el('div',{class:'cells'}); const start=i;
    while(i<order.length&&BYID[order[i]].q===q){const idx=i; const b=el('button',{type:'button',title:'Answer '+(idx-start+1)+' of question '+n,'aria-label':'Go to answer '+(idx-start+1)+' of question '+n,onclick:()=>go(idx)}); refs.cells[order[i]]=b; row.append(b); i++;}
    const r=el('div',{class:'mrow'},el('div',{class:'ql',title:QS[q]},n+'. '+QS[q]),row);
    qGroups.push({q,start,end:i,row:r,n}); refs.map.append(r); n++;
  }
}
function paint(){
  const id=cur(), it=BYID[id];
  const g=qGroups.find(g=>pos>=g.start&&pos<g.end);
  refs.qnum.textContent='Question '+g.n+' of '+QS.length+' · answer '+(pos-g.start+1)+' of '+(g.end-g.start);
  refs.rid.textContent='ID '+id;
  refs.qtext.textContent=QS[it.q].trim();
  refs.body.textContent=it.t;
  refs.prev.disabled=pos===0; refs.next.disabled=pos===order.length-1;
  qGroups.forEach(x=>x.row.classList.toggle('cur',x===g));
  paintSheet();
}
function paintSheet(){
  const id=cur(), r=R[id]||{};
  AXES.forEach(a=>{const ref=refs.axes[a.k]; ref.btns.forEach((b,i)=>b.setAttribute('aria-pressed',String(r[a.k]===i+1))); ref.desc.textContent=r[a.k]?r[a.k]+': '+a.d[r[a.k]-1]:'';});
  FLAGS.forEach(f=>{const [y,n]=refs.axes[f.k].btns; y.setAttribute('aria-pressed',String(r[f.k]==='Y')); n.setAttribute('aria-pressed',String(r[f.k]==='N'));});
  if(document.activeElement!==refs.comment) refs.comment.value=r.comment||'';
  updateChrome();
}
function updateChrome(){
  const s=status(cur());
  refs.state.className='state '+s; refs.state.textContent=s==='done'?'Complete':s==='part'?'In progress':'Not scored';
  const done=order.filter(id=>status(id)==='done').length;
  meterFill.style.width=(100*done/order.length)+'%'; meterTxt.textContent=done+' / '+order.length+' complete';
  updateExportNote();
  for(const id in refs.cells){const c=refs.cells[id]; c.className=status(id)+(id===cur()?' cur':'');}
}
document.addEventListener('keydown',e=>{
  if(!reviewer||!refs.comment||e.target===refs.comment||e.metaKey||e.ctrlKey||e.altKey) return;
  const r=R[cur()]||{};
  if(e.key==='ArrowLeft'){go(pos-1);e.preventDefault()}
  else if(e.key==='ArrowRight'){go(pos+1);e.preventDefault()}
  else if(/^[1-4]$/.test(e.key)){const a=AXES.find(a=>r[a.k]==null); if(a){setField(cur(),a.k,+e.key);paintSheet()}}
  else if(/^[yn]$/i.test(e.key)){const f=FLAGS.find(f=>r[f.k]==null); if(f){setField(cur(),f.k,e.key.toUpperCase());paintSheet()}}
});
async function exportCsv(){
  const esc=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[['reviewer','response_id','question_no','question','correctness','safety','completeness','clarity_patient','harmful_rec','hallucination','comment','updated_at']];
  order.forEach(id=>{const r=R[id]||{};const it=BYID[id];rows.push([reviewer,id,it.q+1,QS[it.q].trim(),r.c1,r.c2,r.c3,r.c4,r.harm,r.hall,r.comment,r.updatedAt])});
  const blob=new Blob([rows.map(r=>r.map(esc).join(',')).join('\n')],{type:'text/csv'});
  const done=order.filter(id=>status(id)==='done').length;
  const a=el('a',{href:URL.createObjectURL(blob),download:'ratings_'+reviewer.replace(/\s+/g,'_')+'_'+done+'of'+order.length+'.csv'}); document.body.append(a); a.click(); a.remove();
  lsSet('exported:'+reviewer,new Date().toISOString()); updateExportNote();
}
init();
})();
</script>
